name: Java

on:
  push:
    paths:
      - "**/java/**"
      - ".github/workflows/java.yml"
  workflow_dispatch:

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every folder that contains a pom.xml is a Java project (<lab>/java/<approach>),
  # so new labs and approaches are built without editing this workflow.
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          projects=$(find . -name pom.xml -not -path '*/target/*' -exec dirname {} \; \
            | sed 's|^\./||' | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({path: ., name: gsub("/"; "-")})')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Java projects: $projects"

  build:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    name: build (${{ matrix.project.path }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: ${{ matrix.project.path }}/pom.xml

      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-jar
          path: ${{ matrix.project.path }}/target/*.jar
          retention-days: 14
